services:
  db:
    container_name: db-queue-scheduler
    image: postgres:17.10-alpine3.23
    restart: always
    hostname: db
    environment:
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "queue"
    ports:
      - "5432:5432"
    volumes:
      - "postgres_volume:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    container_name: migrator-queue-scheduler
    build: 
      context: .
      dockerfile: build/docker/migrate/postgres/Dockerfile
    environment:
      POSTGRES_HOST: db-queue-scheduler
      POSTGRES_DB: queue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  grpcui:
    image: fullstorydev/grpcui
    entrypoint: ["grpcui", "-plaintext", "-bind", "0.0.0.0", "-port", "8080", "queue-sheduler:8090"]
    ports:
      - 5092:8080
    restart: always
    depends_on:
      queue-sheduler:
        condition: service_started

