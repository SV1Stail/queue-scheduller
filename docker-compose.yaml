# local
  queue-sheduler:
    container_name: queue-scheduler
    build: 
      context: .
      dockerfile: ./local/docker/Dockerfile
    restart: always
    ports:
      - 5090:8090 # gRPC
      - 5091:8080 # HTTP
    volumes:
      - "./local/bin:/opt/bin"
      - "./local/etc:/opt/etc"
    entrypoint: ["/opt/bin/queue"]
    environment:
      DATABASE_DSN: "postgres://postgres:postgres@db-queue-scheduler:5432/queue?sslmode=disable"
      GRPC_PORT: "8090"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8090"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
    postgres_volume:

networks:
  default:
    name: shared-net
    external: true